name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package tarball
        run: |
          npm pack
          echo "PACKAGE_FILE=$(ls n8n-nodes-notebooklm-sdk-*.tgz)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: "v0.3.0: Update notebooklm-sdk with domain migration fix"
          body: |
            ## Changes
            - Updated `notebooklm-sdk` dependency to include domain migration fix (`notebook.google.com`).
            
            ## Installation in n8n
            In your n8n directory (e.g. `~/.n8n/nodes` or in custom community node installation):
            ```bash
            npm install https://github.com/darakcheeff/n8n-nodes-notebooklm-sdk/releases/download/v0.3.0/n8n-nodes-notebooklm-sdk-0.2.1.tgz
            ```
          files: |
            ${{ env.PACKAGE_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
